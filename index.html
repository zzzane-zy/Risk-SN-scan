<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1f18" />
    <meta name="description" content="Risk SN barcode scanner – scan P-SN codes and check against the risk list. 风险SN条码扫描器" />
    <title>Risk SN Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="mode-label" data-i18n="modeLabel">扫描</p>
          <h1>Risk SN Check</h1>
        </div>
        <div class="topbar-right">
          <button id="langToggle" class="lang-toggle" type="button" aria-label="Toggle language">EN</button>
          <span id="csvBadge" class="csv-badge">Risk_SN.csv</span>
        </div>
      </header>

      <section class="scanner-panel" aria-label="Scanner">
        <div class="camera-stage" id="cameraStage">
          <video id="preview" autoplay muted playsinline></video>
          <div id="cameraFallback" class="camera-fallback">
            <div class="fallback-inner">
              <svg class="fallback-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                <rect x="4" y="10" width="40" height="28" rx="5" stroke="currentColor" stroke-width="2.5"/>
                <circle cx="24" cy="24" r="8" stroke="currentColor" stroke-width="2.5"/>
                <circle cx="24" cy="24" r="3" fill="currentColor"/>
                <rect x="16" y="6" width="16" height="4" rx="2" fill="currentColor" opacity="0.5"/>
              </svg>
              <span data-i18n="fallbackHint">将P开头SN码置于绿框内</span>
            </div>
          </div>

          <!-- Scan frame with corner markers -->
          <div class="scan-frame" aria-hidden="true">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <div class="scan-line"></div>
          </div>

          <!-- Tap to focus indicator -->
          <div id="focusRing" class="focus-ring" aria-hidden="true"></div>

          <!-- Focus hint overlay -->
          <div class="focus-hint" id="focusHint" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 7V3h4M14 3h4v4M18 13v4h-4M6 17H2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span data-i18n="tapFocus">点击对焦</span>
          </div>
        </div>

        <p class="instruction" data-i18n="instruction">
          将右侧P开头的SN码置于绿框内，其他条码将被忽略。
        </p>

        <div id="status" class="status-line" role="status" data-i18n-loading="loadingCsv">加载 Risk_SN.csv...</div>

        <div class="button-row">
          <button id="scanButton" class="primary-button" type="button" data-i18n="scan">扫描</button>
          <button id="stopButton" class="secondary-button" type="button" disabled data-i18n="stop">停止</button>
          <label class="secondary-button file-button" id="csvLabel">
            CSV
            <input id="csvFile" type="file" accept=".csv,text/csv,text/plain" />
          </label>
        </div>
      </section>

      <section class="entry-panel" aria-label="Manual check">
        <label class="field-label" for="snInput" data-i18n="manualLabel">手动输入 SN</label>
        <div class="entry-row">
          <input id="snInput" autocomplete="off" inputmode="text" placeholder="Enter SN / 输入SN" />
          <button id="checkButton" class="primary-button compact" type="button" data-i18n="check">查询</button>
        </div>
      </section>
    </main>

    <dialog id="resultDialog" class="result-dialog">
      <form method="dialog" class="dialog-body">
        <div id="resultMark" class="result-mark">NOTICE</div>
        <h2 id="resultTitle">No result</h2>
        <p id="resultSn" class="result-sn"></p>
        <p id="resultMessage" class="result-message">No QR content to check.</p>
        <button class="primary-button dialog-button" value="ok" autofocus data-i18n="ok">OK</button>
      </form>
    </dialog>

    <script src="./app.js" type="module"></script>
  </body>
</html>
