<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1f18" />
    <title>Risk SN Check</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="mode-label">Scan</p>
          <h1>Risk SN Check</h1>
        </div>
        <span id="csvBadge" class="csv-badge">Risk_SN.csv</span>
      </header>

      <section class="scanner-panel" aria-label="Scanner">
        <div class="camera-stage">
          <video id="preview" autoplay muted playsinline></video>
          <div id="cameraFallback" class="camera-fallback">
            <span>P-SN / Target right-side P-SN</span>
          </div>
          <div class="scan-frame" aria-hidden="true"></div>
        </div>

        <p class="instruction">
          Place the right-side P-starting SN in the green frame. Other codes are ignored.
        </p>

        <div id="status" class="status-line" role="status">Loading Risk_SN.csv...</div>

        <div class="button-row">
          <button id="scanButton" class="primary-button" type="button">Scan</button>
          <button id="stopButton" class="secondary-button" type="button" disabled>Stop</button>
          <label class="secondary-button file-button">
            CSV
            <input id="csvFile" type="file" accept=".csv,text/csv,text/plain" />
          </label>
        </div>
      </section>

      <section class="entry-panel" aria-label="Manual check">
        <label class="field-label" for="snInput">SN</label>
        <div class="entry-row">
          <input id="snInput" autocomplete="off" inputmode="text" placeholder="Enter SN" />
          <button id="checkButton" class="primary-button compact" type="button">Check</button>
        </div>
      </section>
    </main>

    <dialog id="resultDialog" class="result-dialog">
      <form method="dialog" class="dialog-body">
        <div id="resultMark" class="result-mark">NOTICE</div>
        <h2 id="resultTitle">No result</h2>
        <p id="resultSn" class="result-sn"></p>
        <p id="resultMessage" class="result-message">No QR content to check.</p>
        <button class="primary-button dialog-button" value="ok" autofocus>OK</button>
      </form>
    </dialog>

    <script src="./app.js" type="module"></script>
  </body>
</html>
